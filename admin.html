<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boneless Admin - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #0a0a0a; color: white; }
        .order-card { background: #111; border: 1px solid #222; border-radius: 15px; transition: 0.3s; }
        .order-card:hover { border-color: #00d4ff; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10 border-b border-white/5 pb-6">
            <div>
                <h1 class="text-3xl font-bold italic">BONELESS <span class="text-blue-500">ADMIN</span></h1>
                <p class="text-gray-500 text-sm">إدارة طلبات سيرفرات VPS-6</p>
            </div>
            <div id="adminInfo" class="text-sm bg-blue-500/10 text-blue-400 px-4 py-2 rounded-full border border-blue-500/20">
                جاري التحقق...
            </div>
        </header>

        <div id="stats" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="order-card p-6 text-center">
                <span class="text-gray-500 block mb-2">طلبات بانتظار الدفع</span>
                <span id="pendingCount" class="text-4xl font-black text-yellow-500">0</span>
            </div>
        </div>

        <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
            <i class="fas fa-list text-blue-500"></i> قائمة الطلبات الحالية
        </h2>

        <div id="ordersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

        <div id="noOrders" class="hidden text-center py-20 bg-white/5 rounded-3xl border border-dashed border-white/10">
            <i class="fas fa-inbox text-5xl text-gray-700 mb-4"></i>
            <p class="text-gray-500">لا توجد طلبات جديدة حالياً</p>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEwXwXNHz57g4vrZ_1sUJ_NF8UXL1A5G8",
        authDomain: "boneless-hosts-req.firebaseapp.com",
        projectId: "boneless-hosts-req",
        storageBucket: "boneless-hosts-req.firebasestorage.app",
        messagingSenderId: "264386337640",
        appId: "1:264386337640:web:cca8e74c59e31d2ccad4dd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // حماية اللوحة: تأكد أن إيميلك هو المسموح له فقط (استبدله بإيميلك)
    const ADMIN_EMAIL = "yaunfang76@gmail.com"; 

    onAuthStateChanged(auth, (user) => {
        if (!user || user.email !== ADMIN_EMAIL) {
            document.body.innerHTML = `<div class="h-screen flex items-center justify-center flex-col gap-4">
                <h1 class="text-2xl font-bold text-red-500">غير مصرح لك بالدخول</h1>
                <p class="text-gray-500 text-center">هذه اللوحة مخصصة للأدمن فقط.</p>
                <a href="index.html" class="bg-white text-black px-6 py-2 rounded-full font-bold">العودة للموقع</a>
            </div>`;
        } else {
            document.getElementById('adminInfo').innerText = `أهلاً بك، ${user.displayName}`;
            loadOrders();
        }
    });

    function loadOrders() {
        const ordersList = document.getElementById('ordersList');
        const pendingCount = document.getElementById('pendingCount');
        
        onSnapshot(collection(db, "orders"), (snapshot) => {
            const orders = [];
            snapshot.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));
            
            pendingCount.innerText = orders.length;
            
            if (orders.length === 0) {
                ordersList.innerHTML = "";
                document.getElementById('noOrders').classList.remove('hidden');
                return;
            }

            document.getElementById('noOrders').classList.add('hidden');
            ordersList.innerHTML = orders.map(order => `
                <div class="order-card p-6 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="bg-blue-500/20 text-blue-400 text-[10px] px-2 py-1 rounded font-bold">${order.plan}</span>
                            <span class="text-[10px] text-gray-600">${new Date(order.requestedAt?.seconds * 1000).toLocaleString('ar-BH')}</span>
                        </div>
                        <h3 class="font-bold text-lg mb-1">${order.name}</h3>
                        <p class="text-sm text-gray-500 mb-4">${order.email}</p>
                    </div>
                    
                    <div class="flex gap-2">
                        <button onclick="window.activateOrder('${order.id}')" class="flex-1 bg-green-600 hover:bg-green-500 py-2 rounded-lg text-xs font-bold transition-all">
                            تفعيل (تم الدفع)
                        </button>
                        <button onclick="window.cancelOrder('${order.id}')" class="bg-red-500/10 hover:bg-red-500 text-red-500 p-2 rounded-lg transition-all">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        });
    }

    window.activateOrder = async (id) => {
        if(confirm("هل تأكدت من استلام المبلغ وتريد تفعيل السيرفر؟")) {
            await updateDoc(doc(db, "orders", id), { status: "a" });
            alert("تم إرسال إشعار التفعيل للزبون ✅");
        }
    };

    window.cancelOrder = async (id) => {
        if(confirm("هل أنت متأكد من حذف هذا الطلب؟")) {
            await deleteDoc(doc(db, "orders", id));
        }
    };
</script>
</body>
</html>
