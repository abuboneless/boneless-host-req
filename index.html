<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boneless Hosts | استضافة سيرفرات ماين كرافت قوية وحماية DDoS</title>
    <meta name="description" content="استضافة سيرفرات ماين كرافت فائقة القوة مع حماية متقدمة ضد الهجمات (Anti-DDoS). سيرفرات تعمل 24/7، قابلة للتعديل بالكامل.">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3062/3062634.png">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #050505; color: white; overflow-x: hidden; }
        
        /* الخلفية الجديدة */
        .bg-fixed-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: url('https://images.unsplash.com/photo-1558494949-ef526b0042a0?q=80&w=2000&auto=format&fit=crop') no-repeat center center/cover;
        }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: rgba(0, 0, 0, 0.85); /* تعتيم الخلفية */
            backdrop-filter: blur(3px);
        }

        .highlight { color: #3b82f6; text-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }
        
        .plan-card { 
            background: rgba(20, 20, 20, 0.7); 
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 20px; 
            transition: all 0.3s ease; 
        }
        .plan-card:hover { 
            border-color: #3b82f6; 
            transform: translateY(-5px); 
            background: rgba(30, 30, 30, 0.9);
            box-shadow: 0 10px 40px -10px rgba(59, 130, 246, 0.2);
        }
        
        .whatsapp-float {
            position: fixed; bottom: 30px; left: 30px; background-color: #25d366; color: #FFF;
            border-radius: 50px; width: 60px; height: 60px; 
            display: flex; align-items: center; justify-content: center; font-size: 30px; 
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3); z-index: 100; transition: 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.1); background-color: #128c7e; }

        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* كمية السيرفرات */
        .quantity-btn { cursor: pointer; user-select: none; transition: 0.2s; }
        .quantity-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

<div class="bg-fixed-image"></div>
<div class="bg-overlay"></div>

<a href="https://wa.me/97336464439" target="_blank" class="whatsapp-float">
    <i class="fab fa-whatsapp"></i>
</a>

<section id="loginPage" class="min-h-screen flex flex-col items-center justify-center p-4 text-center">
    <div class="max-w-3xl animate-fade-in-up">
        <h1 class="text-5xl md:text-7xl font-black mb-6 tracking-tight">
            Boneless <span class="highlight">Hosts</span>
        </h1>
        <p class="text-xl md:text-2xl text-gray-300 mb-8 font-light leading-relaxed">
            احصل على سيرفرك الخاص الآن. <br>
            <span class="text-blue-400 font-bold">حماية DDoS</span>، مودات مفتوحة، وتعمل <span class="text-green-400 font-bold">24/7</span>.
        </p>
        
        <button id="googleSignIn" class="group bg-white text-black px-8 py-4 rounded-full font-bold text-lg hover:bg-blue-600 hover:text-white transition-all shadow-xl hover:shadow-blue-600/30 flex items-center justify-center gap-3 mx-auto w-full md:w-auto">
            <i class="fab fa-google text-xl group-hover:text-white transition-colors"></i>
            <span>تسجيل الدخول للبدء</span>
        </button>
    </div>
</section>

<section id="packagesPage" class="min-h-screen pb-20 hidden">
    <nav class="bg-black/60 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-black">Boneless <span class="highlight">Hosts</span></div>
            <div class="flex gap-4 items-center">
                <div id="userInfo" class="hidden md:flex items-center gap-3 bg-white/5 px-4 py-2 rounded-full border border-white/10"></div>
                <button id="logoutBtn" class="text-red-500 hover:bg-red-500/10 p-2 rounded-full transition-colors" title="تسجيل خروج">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6 py-10">
        
        <div id="myOrdersSection" class="mb-12 hidden">
            <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fas fa-list-ul text-blue-500"></i> طلباتي وسيرفراتي</h3>
            <div id="ordersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                </div>
        </div>

        <div class="text-center mb-10">
            <h2 class="text-4xl font-bold mb-3">اختر مواصفات سيرفرك</h2>
            <p class="text-gray-400">يمكنك طلب أكثر من سيرفر في نفس الوقت</p>
        </div>

        <div class="flex justify-center mb-10">
            <div class="bg-[#151515] p-2 rounded-xl border border-white/10 flex items-center gap-3 shadow-lg">
                <span class="text-gray-400 text-sm font-bold px-2">📍 الموقع:</span>
                <select id="locationSelector" onchange="window.renderPlans()" class="bg-black text-white py-2 px-4 rounded-lg border border-gray-700 outline-none focus:border-blue-500 font-bold cursor-pointer">
                    <option value="us">🇺🇸 أمريكا (USA)</option>
                    <option value="de">🇩🇪 ألمانيا (Germany)</option>
                    <option value="sg">🇸🇬 سنغافورة (Singapore)</option>
                </select>
            </div>
        </div>

        <div id="plansGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            </div>
    </div>
</section>

<div id="confirmModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[200] p-4 backdrop-blur-md overflow-y-auto">
    <div class="bg-[#151515] border border-white/10 p-6 md:p-8 rounded-3xl w-full max-w-lg relative shadow-2xl my-auto">
        <button onclick="window.closeModal()" class="absolute top-4 left-4 text-gray-500 hover:text-white transition-colors">
            <i class="fas fa-times text-xl"></i>
        </button>
        
        <h2 class="text-2xl font-bold mb-6 text-center text-white">تأكيد تفاصيل الطلب 🛠️</h2>
        
        <div id="planDetails" class="bg-black/40 p-5 rounded-xl border border-white/5 mb-6 space-y-3">
            </div>

        <div class="mb-6">
            <label class="block text-sm text-gray-400 mb-2 font-bold">عدد السيرفرات المطلوبة:</label>
            <div class="flex items-center justify-between bg-black/40 border border-white/10 rounded-lg p-2">
                <button onclick="window.changeQty(-1)" class="quantity-btn bg-white/10 hover:bg-white/20 w-10 h-10 rounded-lg flex items-center justify-center text-xl font-bold">-</button>
                <span id="qtyDisplay" class="text-xl font-bold">1</span>
                <button onclick="window.changeQty(1)" class="quantity-btn bg-blue-600 hover:bg-blue-500 w-10 h-10 rounded-lg flex items-center justify-center text-xl font-bold">+</button>
            </div>
        </div>

        <div class="mb-8">
            <label class="block text-sm text-gray-400 mb-3 font-bold">كيف تفضل أن نتواصل معك؟</label>
            <div class="grid grid-cols-2 gap-4">
                <label class="cursor-pointer">
                    <input type="radio" name="contactMethod" value="whatsapp" checked class="peer hidden" onchange="window.updateBtnText()">
                    <div class="p-3 rounded-xl border border-white/10 bg-white/5 peer-checked:border-green-500 peer-checked:bg-green-500/10 transition-all text-center">
                        <i class="fab fa-whatsapp text-2xl mb-1 text-green-500"></i>
                        <div class="text-xs font-bold">واتساب</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="contactMethod" value="email" class="peer hidden" onchange="window.updateBtnText()">
                    <div class="p-3 rounded-xl border border-white/10 bg-white/5 peer-checked:border-blue-500 peer-checked:bg-blue-500/10 transition-all text-center">
                        <i class="fas fa-envelope text-2xl mb-1 text-blue-500"></i>
                        <div class="text-xs font-bold">الإيميل</div>
                    </div>
                </label>
            </div>
        </div>

        <div class="border-t border-white/10 pt-4 flex flex-col gap-2">
            <div class="flex justify-between items-center text-lg font-bold mb-4">
                <span class="text-gray-400">الإجمالي النهائي:</span>
                <span id="totalPriceDisplay" class="text-blue-400 text-2xl">$0.00</span>
            </div>
            
            <button onclick="window.confirmOrder()" id="confirmBtn" class="w-full bg-blue-600 py-4 rounded-xl font-bold hover:shadow-lg hover:shadow-blue-500/20 transition-all text-white flex justify-center items-center gap-2 text-lg">
                </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEwXwXNHz57g4vrZ_1sUJ_NF8UXL1A5G8",
        authDomain: "boneless-hosts-req.firebaseapp.com",
        projectId: "boneless-hosts-req",
        storageBucket: "boneless-hosts-req.firebasestorage.app",
        messagingSenderId: "264386337640",
        appId: "1:264386337640:web:cca8e74c59e31d2ccad4dd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let selectedPlanData = null;
    let currentQty = 1;
    const MY_PHONE = "97336464439";

    const plans = [
        { id: 'p1', name: "Starter", ram: "8GB", cpu: "4 vCores", disk: "75GB NVMe", basePrice: 7.99, featured: false },
        { id: 'p2', name: "Basic", ram: "12GB", cpu: "6 vCores", disk: "100GB NVMe", basePrice: 12.99, featured: true },
        { id: 'p3', name: "Pro", ram: "24GB", cpu: "8 vCores", disk: "200GB NVMe", basePrice: 22.99, featured: false },
        { id: 'p4', name: "Elite", ram: "96GB", cpu: "24 vCores", disk: "400GB NVMe", basePrice: 69.99, featured: false }
    ];

    const locationFees = { 'us': 0, 'de': 6.00, 'sg': 3.00 };
    const locationNames = { 'us': '🇺🇸 USA', 'de': '🇩🇪 Germany', 'sg': '🇸🇬 Singapore' };

    // رسم الباقات
    window.renderPlans = () => {
        const grid = document.getElementById('plansGrid');
        const selector = document.getElementById('locationSelector');
        const locCode = selector.value;
        const extraFee = locationFees[locCode];

        grid.innerHTML = plans.map(p => {
            const finalPrice = (p.basePrice + extraFee).toFixed(2);
            
            return `
            <div class="plan-card p-6 flex flex-col relative overflow-hidden ${p.featured ? 'border-blue-500/50' : ''}">
                ${p.featured ? '<div class="absolute top-0 right-0 bg-blue-600 text-xs px-3 py-1 rounded-bl-lg font-bold shadow-lg">الأكثر طلباً</div>' : ''}
                
                <h3 class="text-2xl font-bold mb-2">${p.name}</h3>
                <div class="flex items-baseline gap-1 mb-6">
                    <span class="text-4xl font-black text-blue-400">$${finalPrice}</span>
                    <span class="text-sm text-gray-500">/شهر</span>
                </div>

                <ul class="space-y-3 mb-8 flex-1 text-sm text-gray-300">
                    <li class="flex items-center gap-2"><i class="fas fa-microchip text-blue-500 w-5"></i> ${p.cpu}</li>
                    <li class="flex items-center gap-2"><i class="fas fa-memory text-blue-500 w-5"></i> ${p.ram} RAM</li>
                    <li class="flex items-center gap-2"><i class="fas fa-hdd text-blue-500 w-5"></i> ${p.disk}</li>
                </ul>

                <button onclick="window.initOrder('${p.id}', '${locCode}', ${finalPrice})" 
                    class="w-full py-3 rounded-lg font-bold bg-white text-black hover:bg-blue-500 hover:text-white transition-all shadow-lg">
                    اطلب الآن
                </button>
            </div>
            `;
        }).join('');
    };

    // تحضير الطلب وفتح النافذة
    window.initOrder = (planId, locCode, unitPrice) => {
        if (!currentUser) return alert("يرجى تسجيل الدخول أولاً");
        
        currentQty = 1; // تصفير الكمية
        selectedPlanData = plans.find(p => p.id === planId);
        selectedPlanData.unitPrice = unitPrice;
        selectedPlanData.locName = locationNames[locCode];

        document.getElementById('qtyDisplay').innerText = currentQty;
        
        document.getElementById('planDetails').innerHTML = `
            <div class="flex justify-between items-center text-sm">
                <span class="text-gray-400">نوع السيرفر:</span>
                <span class="font-bold text-white text-lg">${selectedPlanData.name}</span>
            </div>
            <div class="flex justify-between items-center text-sm">
                <span class="text-gray-400">موقع الاستضافة:</span>
                <span class="font-bold text-white">${selectedPlanData.locName}</span>
            </div>
            <div class="flex justify-between items-center text-sm">
                <span class="text-gray-400">سعر الوحدة:</span>
                <span class="font-bold text-gray-300">$${unitPrice}</span>
            </div>
        `;
        
        window.updateTotal();
        window.updateBtnText();
        document.getElementById('confirmModal').style.display = 'flex';
    };

    window.closeModal = () => document.getElementById('confirmModal').style.display = 'none';

    // تغيير الكمية
    window.changeQty = (amount) => {
        if (currentQty + amount < 1) return;
        currentQty += amount;
        document.getElementById('qtyDisplay').innerText = currentQty;
        window.updateTotal();
    };

    // حساب المجموع
    window.updateTotal = () => {
        const total = (selectedPlanData.unitPrice * currentQty).toFixed(2);
        document.getElementById('totalPriceDisplay').innerText = `$${total}`;
    };

    // تحديث نص الزر حسب طريقة التواصل
    window.updateBtnText = () => {
        const method = document.querySelector('input[name="contactMethod"]:checked').value;
        const btn = document.getElementById('confirmBtn');
        if (method === 'whatsapp') {
            btn.innerHTML = '<span>إرسال عبر واتساب</span> <i class="fab fa-whatsapp"></i>';
            btn.className = "w-full bg-[#25d366] py-4 rounded-xl font-bold hover:bg-[#128c7e] transition-all text-white flex justify-center items-center gap-2 text-lg shadow-lg shadow-green-500/20";
        } else {
            btn.innerHTML = '<span>إرسال الطلب</span> <i class="fas fa-paper-plane"></i>';
            btn.className = "w-full bg-blue-600 py-4 rounded-xl font-bold hover:bg-blue-500 transition-all text-white flex justify-center items-center gap-2 text-lg shadow-lg shadow-blue-500/20";
        }
    };

    // تنفيذ الطلب
    window.confirmOrder = async () => {
        const btn = document.getElementById('confirmBtn');
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<div class="loader"></div> جاري المعالجة...';
        btn.disabled = true;

        const method = document.querySelector('input[name="contactMethod"]:checked').value;
        const totalPrice = (selectedPlanData.unitPrice * currentQty).toFixed(2);

        try {
            // إضافة الطلب لقاعدة البيانات (مجموعة orders)
            await addDoc(collection(db, "orders"), {
                uid: currentUser.uid,
                email: currentUser.email,
                name: currentUser.displayName,
                plan: selectedPlanData.name,
                location: selectedPlanData.locName,
                price: parseFloat(totalPrice),
                quantity: currentQty,
                contactMethod: method,
                status: "pending",
                timestamp: serverTimestamp()
            });

            if (method === 'whatsapp') {
                const msg = `السلام عليكم Boneless Hosts 👋\n\n` +
                            `طلبت سيرفر جديد:\n` +
                            `📦 الباقة: *${selectedPlanData.name}*\n` +
                            `🔢 العدد: *${currentQty}*\n` +
                            `📍 الموقع: *${selectedPlanData.locName}*\n` +
                            `💰 الإجمالي: *$${totalPrice}*\n` +
                            `📧 إيميلي: ${currentUser.email}\n\n` +
                            `كيف طريقة الدفع؟`;
                
                window.open(`https://wa.me/${MY_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
            } else {
                alert("✅ تم استلام طلبك بنجاح!\nسنتواصل معك عبر الإيميل قريباً لإكمال إجراءات الدفع والتفعيل.");
            }
            
            window.closeModal();
            
        } catch (error) {
            console.error(error);
            alert("حدث خطأ أثناء الاتصال، يرجى المحاولة مرة أخرى.");
        } finally {
            btn.innerHTML = originalContent;
            btn.disabled = false;
        }
    };

    // Auth & Realtime Orders
    document.getElementById('googleSignIn').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('logoutBtn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('packagesPage').style.display = 'block';
            document.getElementById('userInfo').innerHTML = `
                <img src="${user.photoURL}" class="w-8 h-8 rounded-full border border-white/20">
                <span class="text-sm font-bold hidden md:block">${user.displayName}</span>
            `;

            // جلب طلبات المستخدم السابقة
            const q = query(collection(db, "orders"), where("uid", "==", user.uid), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const ordersList = document.getElementById('ordersList');
                const myOrdersSection = document.getElementById('myOrdersSection');
                
                if (snapshot.empty) {
                    myOrdersSection.classList.add('hidden');
                } else {
                    myOrdersSection.classList.remove('hidden');
                    ordersList.innerHTML = snapshot.docs.map(doc => {
                        const data = doc.data();
                        const statusColor = data.status === 'active' ? 'text-green-500 border-green-500/30 bg-green-500/10' : 'text-yellow-500 border-yellow-500/30 bg-yellow-500/10';
                        const statusText = data.status === 'active' ? '✅ نشط' : '⏳ قيد المراجعة';
                        
                        return `
                            <div class="bg-[#111] p-4 rounded-xl border border-white/5 flex justify-between items-center">
                                <div>
                                    <div class="font-bold text-white">${data.plan} <span class="text-xs text-gray-500">x${data.quantity || 1}</span></div>
                                    <div class="text-xs text-gray-400">${data.location}</div>
                                </div>
                                <div class="text-xs px-3 py-1 rounded-full border ${statusColor} font-bold">
                                    ${statusText}
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            });
            
            window.renderPlans();
        } else {
            currentUser = null;
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('packagesPage').style.display = 'none';
        }
    });
</script>

</body>
</html>
