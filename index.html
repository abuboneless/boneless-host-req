    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #000; color: white; overflow-x: hidden; perspective: 1000px; }
        
        /* --- 1. الخلفيات المتداخلة --- */
        .bg-fixed-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -4;
            background: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2000&auto=format&fit=crop') no-repeat center center/cover;
            animation: bgZoom 30s infinite alternate linear;
        }
        @keyframes bgZoom { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3;
            background: radial-gradient(circle at center, rgba(10,10,10,0.8) 0%, rgba(0,0,0,0.95) 100%);
            backdrop-filter: blur(8px);
        }

        /* خطوط الشاشة الجيمنج (Scanlines) */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; opacity: 0.3;
        }

        /* --- 2. أنيميشن البلوكات الطايرة --- */
        .floating-cubes-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; pointer-events: none; }
        .cube {
            position: absolute; bottom: -100px; background: rgba(161, 161, 170, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(2px);
            animation: floatUp infinite ease-in; border-radius: 4px;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg) scale(0.5); opacity: 0; }
        }

        /* --- 3. تأثير الجليتش (Glitch) الاحترافي --- */
        .glitch-hover:hover { animation: skew-x-shake 0.2s infinite; position: relative; }
        .glitch-hover:hover::before, .glitch-hover:hover::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8;
        }
        .glitch-hover:hover::before { left: 3px; text-shadow: -2px 0 #a1a1aa; animation: glitch-anim 0.3s infinite linear alternate-reverse; clip-path: polygon(0 0, 100% 0, 100% 30%, 0 30%); }
        .glitch-hover:hover::after { left: -3px; text-shadow: -2px 0 #3f3f46; animation: glitch-anim 0.4s infinite linear alternate-reverse; clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%); }
        @keyframes skew-x-shake { 0% { transform: skewX(-10deg); } 5% { transform: skewX(10deg); } 10% { transform: skewX(-10deg); } 15% { transform: skewX(10deg); } 20% { transform: skewX(0deg); } 100% { transform: skewX(0deg); } }
        @keyframes glitch-anim { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }

        /* --- 4. لمعان الأزرار (Shine Sweep) --- */
        .btn-shine { position: relative; overflow: hidden; }
        .btn-shine::before {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); animation: shine 3s infinite cubic-bezier(0.19, 1, 0.22, 1);
        }
        @keyframes shine { 0% { left: -150%; } 20% { left: 200%; } 100% { left: 200%; } }

        /* --- 5. أنيميشن الدخول (Reveal & 3D) --- */
        .reveal-3d { opacity: 0; transform: translateY(80px) rotateX(-20deg) scale(0.9); transform-origin: top center; transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .reveal-3d.active { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }
        .delay-100 { transition-delay: 100ms; } .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; } .delay-400 { transition-delay: 400ms; }

        /* --- 6. تفاعل الكروت (Hover 3D Tilt) --- */
        .plan-card { 
            background: linear-gradient(145deg, rgba(20,20,20,0.8) 0%, rgba(10,10,10,0.9) 100%);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; 
            transition: all 0.4s ease; backdrop-filter: blur(15px);
            transform-style: preserve-3d;
        }
        .plan-card::after {
            content: ''; position: absolute; inset: 0; border-radius: 20px;
            box-shadow: inset 0 0 30px rgba(255,255,255,0); transition: 0.4s ease;
        }
        .plan-card.active:hover { 
            border-color: #e4e4e7; background: rgba(25, 25, 25, 0.95);
            /* حركة الـ 3D العنيفة والفخمة */
            transform: translateY(-15px) rotateX(5deg) rotateY(-5deg) scale3d(1.05, 1.05, 1.05);
            box-shadow: -15px 25px 50px -15px rgba(255, 255, 255, 0.15), 0 0 30px rgba(161, 161, 170, 0.3);
            z-index: 10;
        }
        .plan-card.active:hover::after { box-shadow: inset 0 0 20px rgba(255,255,255,0.05); }

        /* تحركات داخل الكارت نفسه (Parallax Effect) */
        .plan-card > * { transition: transform 0.4s ease; }
        .plan-card.active:hover > h3 { transform: translateZ(30px); text-shadow: 0 10px 20px rgba(0,0,0,0.8); }
        .plan-card.active:hover > .price-block { transform: translateZ(50px); }
        .plan-card.active:hover > button { transform: translateZ(40px); }

        /* --- تأثيرات عامة --- */
        @keyframes floatLogo { 0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 15px 20px rgba(255,255,255,0.1)); } 50% { transform: translateY(-20px) scale(1.05); filter: drop-shadow(0 25px 30px rgba(255,255,255,0.2)); } }
        .animate-float-extreme { animation: floatLogo 4s ease-in-out infinite; }
        
        @keyframes pulseBorder { 0%, 100% { border-color: rgba(255,255,255,0.1); box-shadow: 0 0 10px rgba(255,255,255,0); } 50% { border-color: rgba(255,255,255,0.5); box-shadow: 0 0 25px rgba(255,255,255,0.2); } }
        .pulse-border-active { animation: pulseBorder 2s infinite; }

        .text-metallic { background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 50%, #52525b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .whatsapp-float { position: fixed; bottom: 30px; left: 30px; background-color: #25d366; color: #FFF; border-radius: 50px; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 100; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); animation: floatLogo 3s infinite; }

        .loader { border: 3px solid #333; border-top: 3px solid #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s ease infinite; display: inline-block; }

        const pendingOrders = myOrdersSnapshot.filter(doc => doc.data().status !== 'active');

        const createCard = (doc) => {
            const data = doc.data(); const id = doc.id; const isPending = data.status !== 'active';
            const statusConfig = isPending 
                ? { text: 'جاري التجهيز...', color: 'text-yellow-500', bg: 'bg-yellow-500/10', border: 'border-yellow-500/50', icon: 'fa-cog fa-spin', cardClass: 'border-l-4 border-l-yellow-500' }
                : { text: 'السيرفر أونلاين', color: 'text-green-400', bg: 'bg-green-500/20', border: 'border-green-500/50', icon: 'fa-wifi', cardClass: 'border-l-4 border-l-green-500 shadow-[0_0_20px_rgba(34,197,94,0.1)]' };
            const timeObj = data.requestedAt || data.timestamp;
            const date = timeObj ? new Date(timeObj.seconds * 1000).toLocaleDateString('ar-BH') : 'الآن';
            const methodIcon = data.contactMethod === 'email' ? '<i class="fas fa-envelope text-white"></i>' : '<i class="fab fa-whatsapp text-green-500"></i>';

            return `
            <div class="order-history-card p-6 rounded-2xl relative mb-6 bg-zinc-900/50 border border-zinc-700 hover:scale-[1.02] transition-transform ${statusConfig.cardClass}">
                <div class="flex justify-between items-start mb-5 border-b border-zinc-800 pb-4">
                    <div class="flex flex-col gap-2">
                        <span class="bg-white text-black font-black px-4 py-1.5 rounded-lg text-sm w-fit">${data.plan}</span>
                        <div class="text-xs text-zinc-400 bg-black px-3 py-1.5 rounded-lg cursor-pointer hover:text-white transition w-fit border border-zinc-700" onclick="window.copyOrderId('${id}')" title="انسخ الـ ID">
                            <i class="fas fa-fingerprint mr-1"></i> #${id.slice(0, 8)} <i class="fas fa-copy ml-2"></i>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 text-sm font-black px-4 py-2 rounded-xl border ${statusConfig.color} ${statusConfig.bg} ${statusConfig.border}">
                        <i class="fas ${statusConfig.icon}"></i> ${statusConfig.text}
                    </div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-sm mt-2">
                    <div><span class="text-zinc-500 text-xs block mb-1 font-bold">اللوكيشن</span><div class="font-black text-white text-lg">${data.location}</div></div>
                    <div><span class="text-zinc-500 text-xs block mb-1 font-bold">التكلفة</span><div class="font-black text-green-400 text-xl"><span class="text-zinc-500 text-xs mr-1">x${data.quantity || 1}</span> $${data.price}</div></div>
                    <div><span class="text-zinc-500 text-xs block mb-1 font-bold">التاريخ</span><div class="font-bold text-zinc-300 text-lg">${date}</div></div>
                    <div><span class="text-zinc-500 text-xs block mb-1 font-bold">التواصل</span><div class="font-black text-2xl">${methodIcon}</div></div>
                </div>
            </div>`;
        };

        let html = '';
        if (activeOrders.length > 0) html += `<div class="mb-10"><h3 class="text-green-400 font-black mb-6 text-xl flex items-center gap-3"><i class="fas fa-server"></i> سيرفراتك الشغالة</h3>${activeOrders.map(createCard).join('')}</div>`;
        if (pendingOrders.length > 0) html += `<div class="mb-6"><h3 class="text-yellow-500 font-black mb-6 text-xl flex items-center gap-3"><i class="fas fa-tools"></i> جاري التجهيز</h3>${pendingOrders.map(createCard).join('')}</div>`;
        container.innerHTML = html;
    }

    window.renderPlans = () => {
        const grid = document.getElementById('plansGrid');
        const selector = document.getElementById('locationSelector');
        const locCode = selector.value;
        const extraFee = locationFees[locCode];

        grid.innerHTML = plans.map((p, index) => {
            const finalPrice = (p.basePrice + extraFee).toFixed(2);
            const delayClass = `delay-${(index + 1) * 100}`; 
            
            return `
            <div class="plan-card reveal-3d ${delayClass} p-8 flex flex-col relative group ${p.featured ? 'pulse-border-active shadow-[0_0_30px_rgba(255,255,255,0.1)]' : ''}">
                ${p.featured ? '<div class="absolute top-6 right-[-40px] bg-white text-black text-sm px-12 py-2 font-black shadow-[0_5px_15px_rgba(255,255,255,0.4)] transform rotate-45 z-20">الأكثر طلباً 🔥</div>' : ''}
                
                <h3 class="text-4xl font-black mb-2 text-white">${p.name}</h3>
                <div class="w-16 h-1.5 bg-zinc-700 rounded-full mb-8 group-hover:bg-white transition-colors duration-500 group-hover:w-full"></div>
                
                <div class="price-block flex items-baseline gap-2 mb-10">
                    <span class="text-6xl font-black text-white drop-shadow-[0_0_20px_rgba(255,255,255,0.3)] group-hover:scale-110 transition-transform">$${finalPrice}</span>
                    <span class="text-lg text-zinc-500 font-black">/شهر</span>
                </div>
                
                <ul class="space-y-5 mb-12 flex-1 text-base text-zinc-300 font-bold relative z-10">
                    <li class="flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-zinc-800 flex items-center justify-center border border-zinc-700 group-hover:bg-white group-hover:text-black transition-all"><i class="fas fa-microchip text-xl"></i></div> ${p.cpu}</li>
                    <li class="flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-zinc-800 flex items-center justify-center border border-zinc-700 group-hover:bg-white group-hover:text-black transition-all"><i class="fas fa-memory text-xl"></i></div> ${p.ram} RAM</li>
                    <li class="flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-zinc-800 flex items-center justify-center border border-zinc-700 group-hover:bg-white group-hover:text-black transition-all"><i class="fas fa-hdd text-xl"></i></div> ${p.disk}</li>
                </ul>
                
                <button onclick="window.initOrder('${p.id}', '${locCode}', ${finalPrice})" class="btn-shine w-full py-5 rounded-2xl font-black text-xl ${p.featured ? 'bg-white text-black hover:bg-zinc-200' : 'bg-zinc-800 text-white border border-zinc-600 hover:bg-white hover:text-black'} transition-all shadow-xl relative z-10">
                    أجر السيرفر
                </button>
            </div>`;
        }).join('');

        setTimeout(() => {
            document.querySelectorAll('#plansGrid .reveal-3d').forEach(el => scrollObserver.observe(el));
        }, 50);
    };

    window.initOrder = (planId, locCode, unitPrice) => {
        if (!currentUser) return alert("سجل دخول الأول يا بطل عشان نربط السيرفر بحسابك!");
        currentQty = 1; 
        selectedPlanData = plans.find(p => p.id === planId);
        selectedPlanData.unitPrice = unitPrice;
        selectedPlanData.locName = locationNames[locCode];
        document.getElementById('qtyDisplay').innerText = currentQty;
        
        document.getElementById('planDetails').innerHTML = `
            <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
                <span class="text-zinc-400 font-bold text-lg"><i class="fas fa-cube mr-2"></i> الباقة:</span>
                <span class="font-black text-black bg-white px-4 py-1.5 rounded-lg text-lg">${selectedPlanData.name}</span>
            </div>
            <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
                <span class="text-zinc-400 font-bold text-lg"><i class="fas fa-map-marker-alt mr-2"></i> اللوكيشن:</span>
                <span class="font-black text-white text-lg">${selectedPlanData.locName}</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-zinc-400 font-bold text-lg"><i class="fas fa-tag mr-2"></i> سعر السيرفر:</span>
                <span class="font-black text-green-400 text-2xl drop-shadow-[0_0_10px_rgba(74,222,128,0.5)]">$${unitPrice}</span>
            </div>`;
            
        window.updateTotal();
        window.updateBtnText();
        document.getElementById('confirmModal').style.display = 'flex';
    };

    window.closeModal = () => document.getElementById('confirmModal').style.display = 'none';
    window.changeQty = (amount) => {
        if (currentQty + amount < 1) return;
        currentQty += amount;
        document.getElementById('qtyDisplay').innerText = currentQty;
        window.updateTotal();
    };
    window.updateTotal = () => {
        const total = (selectedPlanData.unitPrice * currentQty).toFixed(2);
        document.getElementById('totalPriceDisplay').innerText = `$${total}`;
    };
    
    window.updateBtnText = () => {
        const method = document.querySelector('input[name="contactMethod"]:checked').value;
        const btn = document.getElementById('confirmBtn');
        if (method === 'whatsapp') {
            btn.innerHTML = '<span>إرسال الطلب واتساب</span> <i class="fab fa-whatsapp text-3xl text-green-500"></i>';
        } else {
            btn.innerHTML = '<span>تأكيد الطلب (إيميل)</span> <i class="fas fa-paper-plane text-2xl text-zinc-500"></i>';
        }
    };

    window.confirmOrder = async () => {
        const btn = document.getElementById('confirmBtn');
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<div class="loader mr-3"></div> جاري التجهيز...';
        btn.disabled = true;

        const method = document.querySelector('input[name="contactMethod"]:checked').value;
        const totalPrice = (selectedPlanData.unitPrice * currentQty).toFixed(2);

        try {
            await addDoc(collection(db, "orders"), {
                uid: currentUser.uid,
                requestedAt: serverTimestamp(),
                timestamp: serverTimestamp(),
                email: currentUser.email,
                name: currentUser.displayName,
                plan: selectedPlanData.name,
                location: selectedPlanData.locName,
                price: parseFloat(totalPrice),
                quantity: currentQty,
                contactMethod: method,
                status: "pending"
            });

            if (method === 'whatsapp') {
                const msg = `🚀 أهلاً Boneless Hosts\nعايز أأجر سيرفر بالمواصفات دي:\n\n📦 الباقة: *${selectedPlanData.name}*\n🔢 العدد: *${currentQty}*\n📍 اللوكيشن: *${selectedPlanData.locName}*\n💰 الإجمالي: *$${totalPrice}*\n📧 إيميل الحساب: ${currentUser.email}\n\nجاهز للدفع، إيه المطلوب؟`;
                window.open(`https://wa.me/${MY_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
            } else {
                alert("✅ تم إرسال طلبك للسيرفرات بنجاح!\nشيك إيميلك قريب.");
            }
            window.closeModal();
            
        } catch (error) {
            console.error(error);
            alert("حدث خطأ في النظام، راجع اتصالك بالنت.");
        } finally {
            btn.innerHTML = originalContent;
            btn.disabled = false;
        }
    };

    document.getElementById('googleSignIn').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('logoutBtn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('packagesPage').style.display = 'block';
            document.getElementById('userInfo').innerHTML = `
                <img src="${user.photoURL}" class="w-8 h-8 rounded-lg border-2 border-white shadow-[0_0_10px_rgba(255,255,255,0.3)]">
                <span class="max-w-[120px] truncate text-white">${user.displayName}</span>`;
            
            const q = query(
                collection(db, "orders"), 
                where("uid", "==", user.uid), 
                orderBy("requestedAt", "desc")
            );

            onSnapshot(q, (snapshot) => {
                myOrdersSnapshot = snapshot.docs;
                const badge = document.getElementById('ordersBadge');
                if(!snapshot.empty) {
                    badge.innerText = snapshot.size;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
                renderOrdersList();
            });
            window.renderPlans();
            
            setTimeout(() => {
                document.querySelectorAll('#packagesPage .reveal-3d').forEach(el => scrollObserver.observe(el));
            }, 100);
            
        } else {
            currentUser = null;
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('packagesPage').style.display = 'none';
        }
    });
</script>
</body>
</html>
