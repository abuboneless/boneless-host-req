<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boneless Hosts | استضافة سيرفرات ماين كرافت</title>

    <link rel="icon" href="./logo.png">
    <meta name="theme-color" content="#050505">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #050505; color: white; overflow-x: hidden; }
        
        /* الخلفية الأساسية */
        .bg-fixed-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3;
            background: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2000&auto=format&fit=crop') no-repeat center center/cover;
        }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(8px);
        }

        /* شبكة ماين كرافت المتحركة */
        .animated-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            animation: moveGrid 20s linear infinite;
            pointer-events: none;
        }
        @keyframes moveGrid {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        /* حركة طفو اللوجو 3D */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        /* إضاءة اللوجو النابضة */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        .pulse-glow { animation: pulseGlow 4s ease-in-out infinite; }
        
        /* تدرج الألوان المعدني للنصوص */
        .text-metallic {
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 50%, #52525b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .plan-card { 
            background: rgba(15, 15, 15, 0.7); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 20px; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            backdrop-filter: blur(10px);
        }
        .plan-card:hover { 
            border-color: #a1a1aa; 
            transform: translateY(-10px) scale(1.02); 
            background: rgba(25, 25, 25, 0.9);
            box-shadow: 0 15px 35px -5px rgba(161, 161, 170, 0.3);
        }

        .order-history-card { background: #111; border: 1px solid #222; transition: 0.2s; }
        .order-history-card:hover { background: #1a1a1a; border-color: #333; }
        .card-active { border-right: 4px solid #22c55e; } 
        .card-pending { border-right: 4px solid #eab308; } 

        .whatsapp-float {
            position: fixed; bottom: 30px; left: 30px; background-color: #25d366; color: #FFF;
            border-radius: 50px; width: 60px; height: 60px; 
            display: flex; align-items: center; justify-content: center; font-size: 30px; 
            box-shadow: 0 5px 25px rgba(37, 211, 102, 0.4); z-index: 100; transition: 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.1) rotate(10deg); background-color: #128c7e; }

        .loader { border: 2px solid #333; border-top: 2px solid #a1a1aa; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #71717a; }
    </style>
</head>
<body>

<section id="packagesPage" class="min-h-screen pb-20 hidden relative z-10">
    <nav class="bg-black/60 backdrop-blur-xl border-b border-white/5 sticky top-0 z-50">

            <div class="flex items-center gap-4 group cursor-pointer">
                <div class="relative w-14 h-14 flex items-center justify-center rounded-2xl bg-gradient-to-br from-zinc-800 to-black border border-zinc-700/50 shadow-[0_0_15px_rgba(161,161,170,0.1)] group-hover:shadow-[0_0_25px_rgba(161,161,170,0.4)] transition-all duration-300 transform group-hover:-rotate-6 group-hover:scale-110">
                    <img src="./logo.png" alt="Logo" class="w-10 h-10 object-contain drop-shadow-lg">

            <div class="flex flex-wrap justify-center gap-4 items-center">

                <button onclick="window.openOrdersModal()" class="bg-zinc-800/50 hover:bg-zinc-700 text-zinc-300 hover:text-white border border-zinc-600/50 px-5 py-2.5 rounded-xl font-bold transition-all flex items-center gap-2 hover:shadow-[0_0_15px_rgba(161,161,170,0.3)]">
                    <i class="fas fa-box-open"></i> طلباتي

    <div class="container mx-auto px-6 py-12">
        <div class="text-center mb-14 pt-5">

            <p class="text-zinc-400 text-lg">اختر المواصفات، حدد الموقع، وابدأ رحلتك فوراً</p>

        <div class="flex justify-center mb-12">

                <span class="text-zinc-400 text-sm font-bold px-3"><i class="fas fa-globe-americas mr-1"></i> الموقع:</span>
                <select id="locationSelector" onchange="window.renderPlans()" class="bg-zinc-900 text-white py-2.5 px-5 rounded-xl border border-zinc-700 outline-none focus:border-zinc-400 font-bold cursor-pointer transition-colors">
                    <option value="us">🇺🇸 أمريكا (USA)</option>

</section>

<div id="ordersModal" class="fixed inset-0 bg-black/95 hidden items-center justify-center z-[250] p-4 backdrop-blur-md">
    <div class="bg-[#0a0a0a] border border-zinc-800 rounded-3xl w-full max-w-2xl h-[85vh] flex flex-col relative shadow-[0_0_50px_rgba(0,0,0,0.8)]">
        <div class="p-6 border-b border-zinc-800 flex justify-between items-center bg-[#111] rounded-t-3xl">

    <div class="bg-[#0a0a0a] border border-zinc-800 p-6 md:p-8 rounded-3xl w-full max-w-lg relative shadow-[0_0_40px_rgba(161,161,170,0.1)] my-auto">
        <button onclick="window.closeModal()" class="absolute top-5 left-5 text-zinc-600 hover:text-white transition-colors bg-zinc-900 w-8 h-8 rounded-full flex items-center justify-center">

                    <div class="p-4 rounded-2xl border border-zinc-800 bg-[#111] peer-checked:border-green-500 peer-checked:bg-green-500/10 transition-all text-center">
                        <i class="fab fa-whatsapp text-3xl mb-2 text-green-500"></i>
                        <div class="text-sm font-bold">واتساب</div>
                    </div>
                </label>

                    <input type="radio" name="contactMethod" value="email" class="peer hidden" onchange="window.updateBtnText()">

            <button onclick="window.confirmOrder()" id="confirmBtn" class="w-full bg-zinc-200 text-black py-4 rounded-xl font-black hover:bg-white transition-all flex justify-center items-center gap-2 text-lg shadow-[0_5px_20px_rgba(255,255,255,0.1)]">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEwXwXNHz57g4vrZ_1sUJ_NF8UXL1A5G8",
        authDomain: "boneless-hosts-req.firebaseapp.com",
        projectId: "boneless-hosts-req",
        storageBucket: "boneless-hosts-req.firebasestorage.app",
        messagingSenderId: "264386337640",
        appId: "1:264386337640:web:cca8e74c59e31d2ccad4dd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let selectedPlanData = null;
    let currentQty = 1;
    let myOrdersSnapshot = [];
    const MY_PHONE = "97336464439";

    const plans = [
        { id: 'p1', name: "Starter", ram: "6GB", cpu: "4 vCores", disk: "75GB NVMe", basePrice: 7.99, featured: false },
        { id: 'p2', name: "Basic", ram: "10GB", cpu: "6 vCores", disk: "100GB NVMe", basePrice: 12.99, featured: true },
        { id: 'p3', name: "Pro", ram: "22GB", cpu: "8 vCores", disk: "200GB NVMe", basePrice: 22.99, featured: false },
        { id: 'p4', name: "Elite", ram: "94GB", cpu: "24 vCores", disk: "400GB NVMe", basePrice: 69.99, featured: false }
    ];

    const locationFees = { 'us': 0, 'de': 6.00, 'sg': 3.00 };
    const locationNames = { 'us': '🇺🇸 USA', 'de': '🇩🇪 Germany', 'sg': '🇸🇬 Singapore' };

    window.openOrdersModal = () => {
        document.getElementById('ordersModal').style.display = 'flex';
        renderOrdersList();
    };
    window.closeOrdersModal = () => document.getElementById('ordersModal').style.display = 'none';

    window.copyOrderId = (id) => {
        navigator.clipboard.writeText(id).then(() => alert("تم نسخ رقم الطلب: " + id));
    };

    function renderOrdersList() {
        const container = document.getElementById('ordersListContent');
        
        if (myOrdersSnapshot.length === 0) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full opacity-40">
                    <i class="fas fa-box-open text-7xl mb-6 text-zinc-600"></i>
                    <p class="text-2xl font-black text-metallic">لا توجد طلبات سابقة</p>
                    <p class="text-zinc-400 mt-2">عالمك الخاص في ماين كرافت بانتظارك!</p>
                </div>
            `;
            return;
        }

        const activeOrders = myOrdersSnapshot.filter(doc => doc.data().status === 'active');
        const pendingOrders = myOrdersSnapshot.filter(doc => doc.data().status !== 'active');

        const createCard = (doc) => {
            const data = doc.data();
            const id = doc.id;
            const isPending = data.status !== 'active';
            
            const statusConfig = isPending 
                ? { text: 'قيد التجهيز', color: 'text-yellow-500', bg: 'bg-yellow-500/10', border: 'border-yellow-500/30', icon: 'fa-cog fa-spin', cardClass: 'card-pending' }
                : { text: 'نشط (Online)', color: 'text-green-500', bg: 'bg-green-500/10', border: 'border-green-500/30', icon: 'fa-signal', cardClass: 'card-active' };
            
            const timeObj = data.requestedAt || data.timestamp;
            const date = timeObj ? new Date(timeObj.seconds * 1000).toLocaleDateString('ar-BH') : 'الآن';
            const methodIcon = data.contactMethod === 'email' ? '<i class="fas fa-envelope text-zinc-400"></i>' : '<i class="fab fa-whatsapp text-green-500"></i>';

            return `
            <div class="order-history-card p-6 rounded-2xl relative mb-4 ${statusConfig.cardClass}">
                <div class="flex justify-between items-start mb-4">
                    <div class="flex flex-col gap-2">
                        <span class="bg-zinc-800 text-white font-black px-4 py-1.5 rounded-xl text-sm w-fit border border-zinc-700 shadow-inner">${data.plan}</span>
                        <div class="text-xs text-zinc-500 bg-black/50 px-3 py-1.5 rounded-lg cursor-pointer hover:text-white transition w-fit border border-zinc-800" onclick="window.copyOrderId('${id}')" title="انسخ الـ ID">
                            #${id.slice(0, 8)} <i class="fas fa-copy ml-1"></i>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 text-sm font-bold px-4 py-1.5 rounded-full border ${statusConfig.color} ${statusConfig.bg} ${statusConfig.border}">
                        <i class="fas ${statusConfig.icon}"></i> ${statusConfig.text}
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm mt-5 bg-black/30 p-4 rounded-xl border border-zinc-800/50">
                    <div>
                        <span class="text-zinc-500 text-xs block mb-1">الموقع</span>
                        <div class="font-bold text-zinc-200">${data.location}</div>
                    </div>
                    <div>
                        <span class="text-zinc-500 text-xs block mb-1">الكمية والتكلفة</span>
                        <div class="font-bold text-white"><span class="text-zinc-500 text-xs mr-1">x${data.quantity || 1}</span> $${data.price}</div>
                    </div>
                    <div>
                        <span class="text-zinc-500 text-xs block mb-1">التاريخ</span>
                        <div class="font-bold text-zinc-300">${date}</div>
                    </div>
                    <div>
                        <span class="text-zinc-500 text-xs block mb-1">التواصل</span>
                        <div class="font-bold text-lg">${methodIcon}</div>
                    </div>
                </div>
            </div>
            `;
        };

        let html = '';
        if (activeOrders.length > 0) {
            html += `<div class="mb-8"><h3 class="text-green-500 font-bold mb-4 flex items-center gap-2"><i class="fas fa-power-off"></i> سيرفراتك الشغالة</h3>${activeOrders.map(createCard).join('')}</div>`;
        }
        if (pendingOrders.length > 0) {
            html += `<div class="mb-6"><h3 class="text-yellow-500 font-bold mb-4 flex items-center gap-2"><i class="fas fa-truck-loading"></i> سيرفرات بنجهزها لك</h3>${pendingOrders.map(createCard).join('')}</div>`;
        }
        container.innerHTML = html;
    }

    window.renderPlans = () => {
        const grid = document.getElementById('plansGrid');
        const selector = document.getElementById('locationSelector');
        const locCode = selector.value;
        const extraFee = locationFees[locCode];

        grid.innerHTML = plans.map(p => {
            const finalPrice = (p.basePrice + extraFee).toFixed(2);
            return `
            <div class="plan-card p-8 flex flex-col relative overflow-hidden group ${p.featured ? 'border-zinc-400/50 shadow-[0_0_20px_rgba(255,255,255,0.05)]' : ''}">
                ${p.featured ? '<div class="absolute top-4 right-[-30px] bg-zinc-200 text-black text-xs px-10 py-1 font-black shadow-lg transform rotate-45">الأكثر طلباً</div>' : ''}
                
                <h3 class="text-3xl font-black mb-1 text-white">${p.name}</h3>
                <div class="w-12 h-1 bg-zinc-600 rounded-full mb-6 group-hover:bg-zinc-300 transition-colors"></div>
                
                <div class="flex items-baseline gap-1 mb-8">
                    <span class="text-5xl font-black text-white drop-shadow-lg">$${finalPrice}</span>
                    <span class="text-sm text-zinc-500 font-bold">/شهرياً</span>
                </div>
                
                <ul class="space-y-4 mb-10 flex-1 text-sm text-zinc-300 font-semibold">
                    <li class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center"><i class="fas fa-microchip text-zinc-400"></i></div> ${p.cpu}</li>
                    <li class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center"><i class="fas fa-memory text-zinc-400"></i></div> ${p.ram} RAM</li>
                    <li class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center"><i class="fas fa-hdd text-zinc-400"></i></div> ${p.disk}</li>
                </ul>
                
                <button onclick="window.initOrder('${p.id}', '${locCode}', ${finalPrice})" class="w-full py-4 rounded-xl font-black ${p.featured ? 'bg-zinc-100 text-black hover:bg-white' : 'bg-zinc-800 text-white hover:bg-zinc-700'} transition-all shadow-lg group-hover:scale-[1.02]">
                    اختيار الباقة
                </button>
            </div>`;
        }).join('');
    };

    window.initOrder = (planId, locCode, unitPrice) => {
        if (!currentUser) return alert("يرجى تسجيل الدخول أولاً");
        currentQty = 1; 
        selectedPlanData = plans.find(p => p.id === planId);
        selectedPlanData.unitPrice = unitPrice;
        selectedPlanData.locName = locationNames[locCode];
        document.getElementById('qtyDisplay').innerText = currentQty;
        
        document.getElementById('planDetails').innerHTML = `
            <div class="flex justify-between items-center border-b border-zinc-800/50 pb-3">
                <span class="text-zinc-400 font-bold"><i class="fas fa-cube mr-2"></i> الباقة:</span>
                <span class="font-black text-white text-lg bg-zinc-800 px-3 py-1 rounded-lg">${selectedPlanData.name}</span>
            </div>
            <div class="flex justify-between items-center border-b border-zinc-800/50 pb-3">
                <span class="text-zinc-400 font-bold"><i class="fas fa-map-marker-alt mr-2"></i> الموقع:</span>
                <span class="font-bold text-zinc-200">${selectedPlanData.locName}</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-zinc-400 font-bold"><i class="fas fa-tag mr-2"></i> سعر السيرفر الواحد:</span>
                <span class="font-black text-white">$${unitPrice}</span>
            </div>`;
            
        window.updateTotal();
        window.updateBtnText();
        document.getElementById('confirmModal').style.display = 'flex';
    };

    window.closeModal = () => document.getElementById('confirmModal').style.display = 'none';
    window.changeQty = (amount) => {
        if (currentQty + amount < 1) return;
        currentQty += amount;
        document.getElementById('qtyDisplay').innerText = currentQty;
        window.updateTotal();
    };
    window.updateTotal = () => {
        const total = (selectedPlanData.unitPrice * currentQty).toFixed(2);
        document.getElementById('totalPriceDisplay').innerText = `$${total}`;
    };
    
    window.updateBtnText = () => {
        const method = document.querySelector('input[name="contactMethod"]:checked').value;
        const btn = document.getElementById('confirmBtn');
        if (method === 'whatsapp') {
            btn.innerHTML = '<span>إرسال الطلب واتساب</span> <i class="fab fa-whatsapp text-xl text-green-600"></i>';
        } else {
            btn.innerHTML = '<span>تأكيد الطلب (إيميل)</span> <i class="fas fa-paper-plane text-xl text-zinc-600"></i>';
        }
    };

    window.confirmOrder = async () => {
        const btn = document.getElementById('confirmBtn');
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<div class="loader mr-2"></div> جاري التجهيز...';
        btn.disabled = true;

        const method = document.querySelector('input[name="contactMethod"]:checked').value;
        const totalPrice = (selectedPlanData.unitPrice * currentQty).toFixed(2);

        try {
            await addDoc(collection(db, "orders"), {
                uid: currentUser.uid,
                requestedAt: serverTimestamp(),
                timestamp: serverTimestamp(),
                email: currentUser.email,
                name: currentUser.displayName,
                plan: selectedPlanData.name,
                location: selectedPlanData.locName,
                price: parseFloat(totalPrice),
                quantity: currentQty,
                contactMethod: method,
                status: "pending"
            });

            if (method === 'whatsapp') {
                const msg = `🔥 أهلاً Boneless Hosts\nعايز أطلب سيرفر جديد بالمواصفات دي:\n\n📦 الباقة: *${selectedPlanData.name}*\n🔢 العدد: *${currentQty}*\n📍 الموقع: *${selectedPlanData.locName}*\n💰 الحساب: *$${totalPrice}*\n📧 إيميلي المربوط: ${currentUser.email}\n\nجاهز للدفع، إيه الخطوة الجاية؟`;
                window.open(`https://wa.me/${MY_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
            } else {
                alert("✅ طلبك وصلنا بنجاح!\nهنتواصل معاك على الإيميل في أسرع وقت.");
            }
            window.closeModal();
            
        } catch (error) {
            console.error(error);
            alert("حدث خطأ، تأكد من اتصالك بالإنترنت وجرب تاني.");
        } finally {
            btn.innerHTML = originalContent;
            btn.disabled = false;
        }
    };

    document.getElementById('googleSignIn').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('logoutBtn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('packagesPage').style.display = 'block';
            document.getElementById('userInfo').innerHTML = `
                <img src="${user.photoURL}" class="w-7 h-7 rounded-lg border border-zinc-600">
                <span class="max-w-[120px] truncate">${user.displayName}</span>`;
            
            const q = query(
                collection(db, "orders"), 
                where("uid", "==", user.uid), 
                orderBy("requestedAt", "desc")
            );

            onSnapshot(q, (snapshot) => {
                myOrdersSnapshot = snapshot.docs;
                const badge = document.getElementById('ordersBadge');
                if(!snapshot.empty) {
                    badge.innerText = snapshot.size;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
                renderOrdersList();
            });
            window.renderPlans();
        } else {
            currentUser = null;
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('packagesPage').style.display = 'none';
        }
    });
</script>
</body>
</html>
